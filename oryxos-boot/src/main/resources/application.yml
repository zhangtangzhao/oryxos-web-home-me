spring:
  application:
    name: oryxos
  # 平台线程池（Tomcat 200）：xerial SQLite JDBC 内部 synchronized 在 JDK 21
  # 虚拟线程上会钉住载体线程，并发下载体耗尽反令读写全面排队
  threads:
    virtual:
      enabled: false
  datasource:
    # SQLite 并发拓扑（三层）：
    # 1) SqliteWriteGate 进程内互斥所有写事务——同一时刻至多一个写者触达引擎，
    #    根除并发 BEGIN IMMEDIATE 的引擎忙等退避车队（尾延迟主因）；
    # 2) WAL 读写并发 + busy_timeout 兜底跨进程写冲突（如 CLI 与 serve 同时运行）；
    # 3) synchronous=OFF：WAL 下提交不 fsync（仅 checkpoint 时），掉电可能丢最近写入
    #    但库不损坏；单节点私有部署换取尾延迟稳定（Windows/NTFS fsync 一次可达数百毫秒）。
    url: jdbc:sqlite:${oryxos.root:.oryxos}/oryxos.db?journal_mode=WAL&busy_timeout=5000&transaction_mode=IMMEDIATE&synchronous=OFF
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 20
      # WAL auto-checkpoint 默认 1000 页（≈4MB）触发，一次拷 4MB WAL 可 stall
      # 写者秒级；64 页（≈256KB）把 stall 切小到毫秒级且保证 WAL 有界
      connection-init-sql: PRAGMA wal_autocheckpoint=64
  # 建表走 schema.sql（幂等 IF NOT EXISTS，每次启动执行）。不用 hibernate
  # ddl-auto=update：hibernate 6 对 SQLite 已有表做 schema 提取时 xerial 返回
  # 空 COLUMN_DEF → NoSuchElementException，第二次启动即崩；且 update 对已有
  # 表无法演进列。改列需手写迁移脚本（CLAUDE.md 常见陷阱）。
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

  # Spring AI provider configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    # DeepSeek uses OpenAI-compatible protocol
    # Additional providers configured via application.yml or environment variables

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200
    # 压测延迟以服务端 %D（处理耗时 ms）为准——Windows 上任何客户端自测
    # 都会被进程调度/TCP 栈放大出数百毫秒伪尾，服务端日志是权威口径
    accesslog:
      enabled: true
      directory: ${oryxos.root:.oryxos}/logs
      prefix: access
      suffix: .log
      # 保持缓冲（默认）：无缓冲会把日志写盘放进请求线程，Windows 文件过滤
      # 驱动（Defender）下高并发时反而制造尾延迟；压测脚本以轮询等 flush
      buffered: true
      pattern: "%D %s %r"

# OryxOS-specific configuration
oryxos:
  root: ${ORYXOS_ROOT:.oryxos}

  # Provider definitions (name → ChatModel mapping)
  providers:
    - name: deepseek
      base-url: https://api.deepseek.com
      api-key-env: DEEPSEEK_API_KEY
    - name: qwen
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key-env: DASHSCOPE_API_KEY
    - name: kimi
      base-url: https://api.moonshot.cn/v1
      api-key-env: MOONSHOT_API_KEY

  # Sandbox whitelist configuration
  sandbox:
    file:
      allowed-paths:
        - ${oryxos.root:.oryxos}
        - ${user.dir}
        - ${java.io.tmpdir}
    shell:
      allowed-commands:
        - ls
        - cat
        - echo
        - grep
        - find
        - wc
        - head
        - tail
        - python
        - python3
        - node
        - git
        - curl
        - wget
    http:
      allowed-domains:
        - api.github.com
        - api.openai.com
        - api.deepseek.com
        - dashscope.aliyuncs.com
        - api.moonshot.cn
        - "*"

  # Memory backend: markdown | sqlite | mem0
  memory:
    backend: markdown

  # 知识库（002-agent-knowledge-base）：嵌入服务走 OpenAI 兼容 /embeddings，
  # 凭证只走环境变量（宪法 VI）。base-url 留空 = 未配置：create/add 不受影响，
  # ingest/search 在使用时点名缺失配置项，启动不崩溃（research D2/D9）。
  kb:
    embedding:
      base-url: ${KB_EMBEDDING_BASE_URL:}        # 例: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key-env: ${KB_EMBEDDING_API_KEY_ENV:DASHSCOPE_API_KEY}
      model: ${KB_EMBEDDING_MODEL:text-embedding-v3}
      dimensions: ${KB_EMBEDDING_DIMENSIONS:1024}
    search:
      top-k: 5               # kb_search 默认返回条数（上限 20）
      candidate-pool: 50     # 语义/关键词两路各取的候选池大小
      rrf-k: 60              # 加权 RRF 常数
      semantic-weight: 0.7   # 语义路权重
      keyword-weight: 0.3    # 关键词路权重
      semantic-floor: 0.35   # 语义路余弦下限：低于即弃（两路皆空 → zero_result）
    chunk:
      target-chars: 500      # 分段打包目标字符数
      overlap-chars: 50      # 相邻分段重叠字符数

  # Default notify webhook (clarification #1); override with ORYXOS_NOTIFY_WEBHOOK_URL
  notify:
    webhook-url: ${ORYXOS_NOTIFY_WEBHOOK_URL:}

logging:
  level:
    root: INFO
    com.oryxos: WARN
