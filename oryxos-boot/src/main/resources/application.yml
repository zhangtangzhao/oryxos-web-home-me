spring:
  application:
    name: oryxos
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${oryxos.root:.oryxos}/oryxos.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

  # Spring AI provider configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    # DeepSeek uses OpenAI-compatible protocol
    # Additional providers configured via application.yml or environment variables

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200

# OryxOS-specific configuration
oryxos:
  root: ${ORYXOS_ROOT:.oryxos}

  # Provider definitions (name → ChatModel mapping)
  providers:
    - name: deepseek
      base-url: https://api.deepseek.com
      api-key-env: DEEPSEEK_API_KEY
    - name: qwen
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key-env: DASHSCOPE_API_KEY
    - name: kimi
      base-url: https://api.moonshot.cn/v1
      api-key-env: MOONSHOT_API_KEY

  # Sandbox whitelist configuration
  sandbox:
    file:
      allowed-paths:
        - ${oryxos.root:.oryxos}
        - ${user.dir}
        - ${java.io.tmpdir}
    shell:
      allowed-commands:
        - ls
        - cat
        - echo
        - grep
        - find
        - wc
        - head
        - tail
        - python
        - python3
        - node
        - git
        - curl
        - wget
    http:
      allowed-domains:
        - api.github.com
        - api.openai.com
        - api.deepseek.com
        - dashscope.aliyuncs.com
        - api.moonshot.cn
        - "*"

  # Memory backend: markdown | sqlite | mem0
  memory:
    backend: markdown

logging:
  level:
    root: INFO
    com.oryxos: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
