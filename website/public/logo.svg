<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="OryxOS logo">
  <defs>
    <linearGradient id="oryx-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#E8530F"/>
    </linearGradient>
    <linearGradient id="oryx-horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#FFC58F"/>
    </linearGradient>
  </defs>

  <!-- Horns: long, straight, parallel — the oryx signature -->
  <polygon points="104,74 88,80 68,14 84,10" fill="url(#oryx-horn)"/>
  <polygon points="136,74 152,80 172,14 156,10" fill="url(#oryx-horn)"/>

  <!-- Head: geometric shield -->
  <path d="M120 48 L152 60 L168 112 L152 162 L120 208 L88 162 L72 112 L88 60 Z"
        fill="url(#oryx-head)"/>

  <!-- Inner keyline -->
  <path d="M120 58 L147 69 L161 112 L147 158 L120 198 L93 158 L79 112 L93 69 Z"
        fill="none" stroke="#FFDDBE" stroke-width="2" opacity="0.55" stroke-linejoin="round"/>

  <!-- Eye markings -->
  <polygon points="97,101 114,109 112,116 95,108" fill="#3A1D0A"/>
  <polygon points="143,101 126,109 128,116 145,108" fill="#3A1D0A"/>

  <!-- Muzzle -->
  <polygon points="120,168 132,180 120,192 108,180" fill="#3A1D0A"/>
</svg>
